<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Iniciar sesión | Reservas JAS Colombia</title>

  <!-- Librería oficial de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #0b3150;
      --primary-dark: #071b2d;
      --primary-light: #175b86;
      --accent: #f58220;
      --white: #ffffff;
      --text: #173247;
      --muted: #667987;
      --border: #d8e0e6;
      --error-bg: #fff0f0;
      --error-text: #a82121;
      --success-bg: #edf9f1;
      --success-text: #176b38;
      --info-bg: #eef6fc;
      --info-text: #1b5e89;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(
          circle at top right,
          rgba(51, 123, 167, 0.28),
          transparent 32%
        ),
        linear-gradient(
          135deg,
          var(--primary-dark),
          var(--primary)
        );
    }

    .login-wrapper {
      width: 100%;
      max-width: 440px;
    }

    .login-card {
      width: 100%;
      padding: 38px 34px 32px;
      background: var(--white);
      border-radius: 18px;
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.28);
    }

    .brand {
      margin-bottom: 30px;
      text-align: center;
    }

    .brand-badge {
      width: 70px;
      height: 70px;
      margin: 0 auto 18px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(
        145deg,
        var(--primary),
        var(--primary-light)
      );
      color: var(--white);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1px;
      box-shadow: 0 10px 22px rgba(11, 49, 80, 0.25);
    }

    .brand h1 {
      margin-bottom: 8px;
      color: var(--primary);
      font-size: 28px;
      line-height: 1.2;
    }

    .brand p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
    }

    .input-wrapper {
      position: relative;
    }

    input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      background: var(--white);
      color: var(--text);
      font-size: 15px;
      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    input:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(23, 91, 134, 0.13);
    }

    input::placeholder {
      color: #9aa8b2;
    }

    #password {
      padding-right: 82px;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 7px;
      min-width: 65px;
      padding: 8px 9px;
      transform: translateY(-50%);
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .toggle-password:hover {
      background: #edf4f8;
    }

    .login-button {
      width: 100%;
      height: 50px;
      margin-top: 5px;
      border: none;
      border-radius: 9px;
      background: var(--primary);
      color: var(--white);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition:
        background 0.2s ease,
        transform 0.1s ease;
    }

    .login-button:hover:not(:disabled) {
      background: var(--primary-light);
    }

    .login-button:active:not(:disabled) {
      transform: scale(0.99);
    }

    .login-button:disabled {
      cursor: not-allowed;
      opacity: 0.66;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.45;
      text-align: left;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: var(--error-bg);
      color: var(--error-text);
      border: 1px solid #f2cccc;
    }

    .message.success {
      background: var(--success-bg);
      color: var(--success-text);
      border: 1px solid #cbe8d5;
    }

    .message.info {
      background: var(--info-bg);
      color: var(--info-text);
      border: 1px solid #cce3f1;
    }

    .security-note {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #e7ecef;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    footer {
      margin-top: 18px;
      color: #afc1ce;
      font-size: 12px;
      text-align: center;
    }

    .spinner {
      width: 17px;
      height: 17px;
      margin-right: 8px;
      display: none;
      vertical-align: middle;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: var(--white);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .login-button.loading .spinner {
      display: inline-block;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 16px;
      }

      .login-card {
        padding: 30px 22px 26px;
        border-radius: 14px;
      }

      .brand h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <main class="login-wrapper">

    <section class="login-card">

      <div class="brand">
        <div class="brand-badge">JAS</div>

        <h1>Reservas JAS Colombia</h1>

        <p>
          Ingresa con el correo corporativo y la contraseña
          asignada por IT.
        </p>
      </div>

      <form id="loginForm" novalidate>

        <div class="form-group">
          <label for="email">
            Correo corporativo
          </label>

          <input
            id="email"
            name="email"
            type="email"
            placeholder="nombre.apellido@jas.com"
            autocomplete="username"
            inputmode="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">
            Contraseña
          </label>

          <div class="input-wrapper">
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Ingresa tu contraseña"
              autocomplete="current-password"
              required
            >

            <button
              id="togglePassword"
              class="toggle-password"
              type="button"
              aria-label="Mostrar contraseña"
            >
              Mostrar
            </button>
          </div>
        </div>

        <button
          id="loginButton"
          class="login-button"
          type="submit"
        >
          <span class="spinner" aria-hidden="true"></span>
          <span id="loginButtonText">INICIAR SESIÓN</span>
        </button>

        <div
          id="message"
          class="message"
          role="alert"
          aria-live="polite"
        ></div>

      </form>

      <div class="security-note">
        El acceso está restringido a usuarios autorizados.
        Las reservas quedarán asociadas a la cuenta que inició
        sesión.
      </div>

    </section>

    <footer>
      JAS Forwarding Colombia | Sistema de Reservas
    </footer>

  </main>

  <script>
    "use strict";

    /*
     * ============================================================
     * CONFIGURACIÓN SUPABASE
     * ============================================================
     *
     * 1. Cambia TU_SUPABASE_URL por la URL del proyecto.
     *    Ejemplo:
     *    https://abcdefghijk.supabase.co
     *
     * 2. Pega únicamente la clave pública que empieza por:
     *    sb_publishable_
     *
     * NUNCA pegues aquí la clave service_role.
     */

    const SUPABASE_URL = "TU_SUPABASE_URL";

    const SUPABASE_PUBLISHABLE_KEY =
      "TU_CLAVE_PUBLICA_SB_PUBLISHABLE";

    /*
     * Archivo al que se enviará el usuario una vez
     * se autentique correctamente.
     *
     * Actualmente apunta a la página principal del portal.
     */

    const DESTINO_DESPUES_LOGIN = "index.html";

    /*
     * Dominio corporativo permitido.
     * Se valida antes de enviar la solicitud a Supabase.
     */

    const DOMINIO_PERMITIDO = "@jas.com";

    /*
     * Verificación básica de configuración.
     */

    const CONFIGURACION_INCOMPLETA =
      SUPABASE_URL === "TU_SUPABASE_URL" ||
      SUPABASE_PUBLISHABLE_KEY ===
        "TU_CLAVE_PUBLICA_SB_PUBLISHABLE";

    /*
     * Creación del cliente Supabase.
     */

    let supabaseClient = null;

    if (!CONFIGURACION_INCOMPLETA) {
      supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
            storage: window.localStorage
          }
        }
      );
    }

    /*
     * Elementos del formulario.
     */

    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const loginButtonText =
      document.getElementById("loginButtonText");

    const togglePasswordButton =
      document.getElementById("togglePassword");

    const messageBox =
      document.getElementById("message");

    /*
     * Administración de mensajes.
     */

    function mostrarMensaje(texto, tipo) {
      messageBox.textContent = texto;
      messageBox.className = "message show " + tipo;
    }

    function ocultarMensaje() {
      messageBox.textContent = "";
      messageBox.className = "message";
    }

    /*
     * Estado visual del botón.
     */

    function establecerCargando(cargando) {
      loginButton.disabled = cargando;
      emailInput.disabled = cargando;
      passwordInput.disabled = cargando;

      loginButton.classList.toggle(
        "loading",
        cargando
      );

      loginButtonText.textContent = cargando
        ? "VALIDANDO..."
        : "INICIAR SESIÓN";
    }

    /*
     * Normalización y validación del correo.
     */

    function normalizarCorreo(correo) {
      return correo.trim().toLowerCase();
    }

    function correoCorporativoValido(correo) {
      return correo.endsWith(DOMINIO_PERMITIDO);
    }

    /*
     * Guarda únicamente información básica para mostrarla
     * en la interfaz.
     *
     * La seguridad real no debe depender de localStorage.
     * La seguridad debe depender de la sesión de Supabase y
     * de las políticas RLS de la base de datos.
     */

    function guardarDatosLocales(user) {
      localStorage.setItem(
        "loggedIn",
        "true"
      );

      localStorage.setItem(
        "jas_user_id",
        user.id
      );

      localStorage.setItem(
        "jas_user_email",
        user.email || ""
      );
    }

    function limpiarDatosLocales() {
      localStorage.removeItem("loggedIn");
      localStorage.removeItem("jas_user_id");
      localStorage.removeItem("jas_user_email");
    }

    /*
     * Comprueba si ya existe una sesión válida.
     *
     * Si la sesión existe, no se vuelve a pedir la contraseña.
     */

    async function comprobarSesionActual() {
      if (CONFIGURACION_INCOMPLETA) {
        mostrarMensaje(
          "Debes configurar la URL y la clave pública de " +
          "Supabase antes de utilizar el login.",
          "error"
        );

        loginButton.disabled = true;
        return;
      }

      try {
        const {
          data: { session },
          error
        } = await supabaseClient.auth.getSession();

        if (error) {
          throw error;
        }

        if (session && session.user) {
          guardarDatosLocales(session.user);

          mostrarMensaje(
            "Ya tienes una sesión activa. Redirigiendo...",
            "success"
          );

          window.setTimeout(function () {
            window.location.replace(
              DESTINO_DESPUES_LOGIN
            );
          }, 500);
        }
      } catch (error) {
        console.error(
          "Error comprobando la sesión:",
          error
        );

        limpiarDatosLocales();

        mostrarMensaje(
          "No fue posible comprobar la sesión. " +
          "Puedes intentar iniciar sesión nuevamente.",
          "error"
        );
      }
    }

    /*
     * Inicio de sesión mediante correo + contraseña.
     */

    loginForm.addEventListener(
      "submit",
      async function (event) {
        event.preventDefault();
        ocultarMensaje();

        if (CONFIGURACION_INCOMPLETA) {
          mostrarMensaje(
            "La conexión con Supabase no está configurada.",
            "error"
          );
          return;
        }

        const email =
          normalizarCorreo(emailInput.value);

        const password =
          passwordInput.value;

        if (!email) {
          mostrarMensaje(
            "Ingresa tu correo corporativo.",
            "error"
          );

          emailInput.focus();
          return;
        }

        if (!correoCorporativoValido(email)) {
          mostrarMensaje(
            "Debes utilizar un correo corporativo @jas.com.",
            "error"
          );

          emailInput.focus();
          return;
        }

        if (!password) {
          mostrarMensaje(
            "Ingresa tu contraseña.",
            "error"
          );

          passwordInput.focus();
          return;
        }

        establecerCargando(true);

        try {
          const {
            data,
            error
          } =
            await supabaseClient.auth.signInWithPassword({
              email: email,
              password: password
            });

          if (error) {
            throw error;
          }

          if (
            !data ||
            !data.user ||
            !data.session
          ) {
            throw new Error(
              "Supabase no devolvió una sesión válida."
            );
          }

          guardarDatosLocales(data.user);

          mostrarMensaje(
            "Inicio de sesión correcto. Redirigiendo...",
            "success"
          );

          window.setTimeout(function () {
            window.location.replace(
              DESTINO_DESPUES_LOGIN
            );
          }, 650);

        } catch (error) {
          console.error(
            "Error iniciando sesión:",
            error
          );

          limpiarDatosLocales();

          /*
           * No mostramos el error técnico completo para evitar
           * revelar si la cuenta existe o cuál dato fue incorrecto.
           */

          mostrarMensaje(
            "Correo o contraseña incorrectos. " +
            "Verifica los datos e intenta nuevamente.",
            "error"
          );

          establecerCargando(false);
          passwordInput.select();
        }
      }
    );

    /*
     * Mostrar u ocultar contraseña.
     */

    togglePasswordButton.addEventListener(
      "click",
      function () {
        const mostrando =
          passwordInput.type === "text";

        passwordInput.type =
          mostrando ? "password" : "text";

        togglePasswordButton.textContent =
          mostrando ? "Mostrar" : "Ocultar";

        togglePasswordButton.setAttribute(
          "aria-label",
          mostrando
            ? "Mostrar contraseña"
            : "Ocultar contraseña"
        );

        passwordInput.focus();
      }
    );

    /*
     * Limpia mensajes al cambiar datos.
     */

    emailInput.addEventListener(
      "input",
      ocultarMensaje
    );

    passwordInput.addEventListener(
      "input",
      ocultarMensaje
    );

    /*
     * Inicio de la página.
     */

    document.addEventListener(
      "DOMContentLoaded",
      comprobarSesionActual
    );
  </script>

</body>
</html>
